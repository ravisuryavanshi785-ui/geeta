name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Android SDK 36
        run: |
          rm -f local.properties
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
            "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Write .env from GitHub Secrets
        run: |
          {
            printf 'GROQ_API_KEY="%s"\n' "${{ secrets.GROQ_API_KEY }}"
            printf 'CLOUDFLARE_ACCOUNT_ID="%s"\n' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            printf 'CLOUDFLARE_API_TOKEN="%s"\n' "${{ secrets.CLOUDFLARE_API_TOKEN }}"
            printf 'GEMINI_API_KEY="%s"\n' "${{ secrets.GEMINI_API_KEY }}"
          } > .env

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSMovieSpot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
